server {
        listen *:80;
        server_name starlink.minasforce.com.br;

        # Caso queira não forçar a utilização do HTTPS é preciso desativar o protocolo HTTP2.
        listen *:443 ssl http2;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        #ssl_certificate /etc/letsencrypt/live/starlink.minasforce.com.br/fullchain.pem;
        #ssl_certificate_key /etc/letsencrypt/live/starlink.minasforce.com.br/privkey.pem;

        # note that these lines are originally from the "location /" block
        root /usr/share/nginx/pagamentosuper/starlink.minasforce.com.br;
        index index.htm index.html index.php;

        error_log /var/log/nginx/starlink.minasforce.com.br.log;
        access_log /var/log/nginx/starlink.minasforce.com.br.log combined;

        location / {
		# Permite somente acesso interno.
		# allow 201.17.245.136;
		# deny all;
                # Substituto do Rewrite do Apache.
                try_files $uri $uri/ /index.php$is_args$args;
        }
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
                root /usr/share/nginx/pagamentosuper/starlink.minasforce.com.br;
        }

        location ~ /\. {
                deny all;
                access_log off;
                log_not_found off;
        }

        location = /favicon.ico {
                log_not_found off;
                access_log off;
        }

        location = /robots.txt {
                allow all;
                log_not_found off;
                access_log off;
        }

        location ~ \.php$ {
                try_files $uri =404;
                fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                include fastcgi_params;
		fastcgi_buffers 8 8k; 
		fastcgi_buffer_size 8k;
        }

	# Forçar HTTPS.
        #if ($scheme != "https") {
        #        rewrite ^(.*)$ https://starlink.minasforce.com.br$1 permanent;
        #}
}

